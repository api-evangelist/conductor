- type: Features
  data:
  - name: Workflow Orchestration
    description: Define and execute complex workflows with sequential and parallel
      task execution.
  - name: Task Management
    description: Register, poll, and update granular task definitions with timeout
      and retry policies.
  - name: Event Handling
    description: Create event handlers to trigger workflows or tasks based on external
      events.
  - name: Workflow Search
    description: Search and filter workflow executions by status, type, and custom
      parameters.
  - name: Fault Tolerance
    description: Automatic retries, pause/resume, and graceful failure handling for
      long-running workflows.
  - name: Workflow Lifecycle Control
    description: Pause, resume, restart, retry, and terminate workflows programmatically.
- type: UseCases
  data:
  - name: Microservices Orchestration
    description: Coordinate complex business processes across distributed microservices
      without tight coupling.
  - name: Data Pipeline Automation
    description: Build and manage ETL and data processing pipelines with dependency
      tracking and error recovery.
  - name: Order Processing
    description: Manage multi-step order fulfillment workflows including payment,
      inventory, and shipping.
  - name: CI/CD Pipelines
    description: Orchestrate build, test, and deployment workflows with conditional
      logic and parallel execution.
- type: Integrations
  data:
  - name: Apache Kafka
    description: Trigger workflows and tasks from Kafka events using event handler
      subscriptions.
  - name: Amazon SQS
    description: Integrate with SQS for message-driven workflow initiation and task
      completion.
  - name: Docker
    description: Run Conductor server and workers in containerized environments for
      scalable deployment.
  - name: Orkes Cloud
    description: Use managed Conductor service from Orkes for enterprise-grade orchestration
      without infrastructure management.
